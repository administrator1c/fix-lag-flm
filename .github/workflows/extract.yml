
name: Extract FLM BOOST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p temp
          unzip -o FLM-BOOST-GitHub-Source.zip -d temp

          if [ -f temp/FLM-BOOST/settings.gradle ]; then
            cp -a temp/FLM-BOOST/. .
          elif [ -f temp/settings.gradle ]; then
            cp -a temp/. .
          else
            echo "Cannot find Android project"
            find temp -maxdepth 4 -type f
            exit 1
          fi

          rm -rf temp

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || \
            git commit -m "Extract FLM BOOST"
          git push
