
name: Extract FLM BOOST Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f \
            -iname 'FLM-BOOST-GitHub-Source.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/flm-source"
          unzip -q -o "$ZIP" \
            -d "$RUNNER_TEMP/flm-source"

          if [ -f "$RUNNER_TEMP/flm-source/FLM-BOOST/settings.gradle" ]; then
            SRC="$RUNNER_TEMP/flm-source/FLM-BOOST"
          elif [ -f "$RUNNER_TEMP/flm-source/settings.gradle" ]; then
            SRC="$RUNNER_TEMP/flm-source"
          else
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          cp -a "$SRC/app" .
          cp "$SRC/settings.gradle" .
          cp "$SRC/build.gradle" .
          cp "$SRC/gradle.properties" .

          echo "Android source extracted successfully"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app settings.gradle build.gradle gradle.properties

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract FLM BOOST Android project"
            git push
          fi
