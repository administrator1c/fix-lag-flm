name: Build FLM BOOST APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project=""
          for dir in . FLM-BOOST extracted extracted/FLM-BOOST; do
            if [[ -f "$dir/settings.gradle" || -f "$dir/settings.gradle.kts" ]]; then
              project="$dir"
              break
            fi
          done
          if [[ -z "$project" ]]; then
            echo 'Cannot find settings.gradle. Upload extracted Android project files.' >&2
            find . -maxdepth 4 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
            exit 1
          fi
          echo "dir=$project" >> "$GITHUB_OUTPUT"
          echo "Android project found: $project"

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon --stacktrace -p '${{ steps.project.outputs.dir }}' :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
